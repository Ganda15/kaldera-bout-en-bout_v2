# Intégration continue : à chaque push et à chaque pull request, sous Python 3.11 (version exigée par pyproject.toml),
# installe le projet, vérifie le style (ruff) puis lance les tests.
# Tests lancés : nos tests unitaires et les tests d'acceptance du chantier 1. Les tests du chantier 2
# (tests/acceptance/test_collaboration_a2a.py) rejoindront la chaîne quand le client A2A sera branché :
# ils échouent aujourd'hui par construction (partenaire bouchon), la chaîne serait rouge pour une raison connue.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer le projet et les outils de développement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Style (ruff)
        run: python -m ruff check .

      - name: Tests unitaires
        run: python -m pytest tests/unit -q

      - name: Tests d'acceptance du chantier 1
        run: python -m pytest tests/acceptance/test_equipe_orchestration.py -q
